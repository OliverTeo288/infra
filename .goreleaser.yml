builds:
  - binary: infra
    ldflags:
      - '-X "raid/infra/internal/config.GitlabHTTPSDomain={{ .Env.GITLAB_HTTPS_DOMAIN }}"'
      - '-X "raid/infra/internal/config.GitlabSSHDomain={{ .Env.GITLAB_SSH_DOMAIN }}"'
      - '-X "raid/infra/internal/config.CommonAWSAccountID={{ .Env.COMMON_AWS_ACCOUNT_ID }}"'
      - '-X "raid/infra/internal/config.OIDCSubjectPattern={{ .Env.OIDC_SUBJECT_PATTERN }}"'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64


universal_binaries:
  - replace: true

brews:
  -
    name: infra
    homepage: "https://github.com/oliverteo288/infra"
    repository:
      owner: oliverteo288
      name: homebrew-infra
    commit_author:
      name: oliverteo288
      email: oliver_teo288@hotmail.com

checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ incpatch .Version }}-next"